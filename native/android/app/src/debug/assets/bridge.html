<!doctype html>
<!-- The instrumented tests' stand-in for the web app: the page side of the
     bridge, recording everything, in debug builds only. -->
<html><head><meta charset="utf-8"><title>bridge</title></head>
<body>
<a id="away" href="https://example.com/">another site</a>
<!-- A sandboxed frame has an opaque origin: another site, as far as the bridge is concerned. -->
<iframe id="foreign" sandbox="allow-scripts" srcdoc="<script>parent.postMessage({frameSeesHost: typeof window.SpatialNativeHost}, '*')</script>"></iframe>
<!-- A srcdoc frame without a sandbox shares this page's origin; it may see the
     bridge object, but the app answers the main frame only. -->
<iframe id="sub" srcdoc="<script>window.sendFromFrame = (m) => window.SpatialNativeHost && window.SpatialNativeHost.postMessage(JSON.stringify(m))</script>"></iframe>
<script>
  window.received = [];
  window.frameSeesHost = 'not yet';
  // What the app delivers: a JSON string, as src/native/bridge.ts receives it.
  window.spatialNative = { receive: (json) => window.received.push(JSON.parse(json)) };
  window.addEventListener('message', (e) => { if (e.data && 'frameSeesHost' in e.data) window.frameSeesHost = e.data.frameSeesHost; });
  window.send = (message) => window.SpatialNativeHost.postMessage(typeof message === 'string' ? message : JSON.stringify(message));
</script>
</body></html>
