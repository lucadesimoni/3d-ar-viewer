name: Release
# Push a tag `vX.Y.Z` (matching package.json's version, with a CHANGELOG.md
# section) to release every component:
#
#   - the web app, as .zip and .tar.gz;
#   - the server, as an npm package;
#   - the container image, for linux/amd64 and linux/arm64, as `docker load`
#     archives;
#   - the Mendix widget, as an .mpk;
#   - SHA256SUMS.txt over the files, and the changelog section as the notes.
#
# All of them as files on the GitHub release and nowhere else: the software is
# proprietary (LICENSE), so nothing goes to a public registry.
#
# Run by hand from the Actions tab, it builds and checks all of it and
# publishes nothing: a dry run. Run by hand on `main` with "publish" ticked, it
# tags `vX.Y.Z` (package.json's version) itself and releases, after the same
# checks. See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Tag vX.Y.Z from package.json and publish (main only). Unticked, a dry run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Publishing happens on a pushed tag, or a manual run on main that asks to.
  PUBLISH: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}

jobs:
  # The whole CI battery, the same one every merge passes.
  verify:
    uses: ./.github/workflows/ci.yml

  packages:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: The tag is the version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json's version $v."
            exit 1
          fi
          # A manual release makes its own tag: refuse one that already exists.
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF_TYPE" != tag ] \
            && git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "::error::v$v is already tagged. Bump package.json's version to release again."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Package every component
        run: BUILD_COMMIT="${GITHUB_SHA::7}" npm run release:package
      - name: Try every package the way its user would
        run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          retention-days: 14

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Names
        id: names
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Built for this runner first and actually run: an image that builds is
      # not yet an image that serves.
      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: spatial-ar:check
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            BUILD_COMMIT=${{ steps.names.outputs.commit }}
      - name: Try the image
        run: |
          docker run -d --name check -p 8080:8080 spatial-ar:check
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/healthz > /dev/null || { docker logs check; exit 1; }
          curl -sf http://localhost:8080/ | grep -q '<div id="root"' || { echo "::error::The image does not serve the app."; exit 1; }
          [ "$(docker exec check id -un)" = node ] || { echo "::error::The image runs as root."; exit 1; }
          docker rm -f check
      # Both architectures, as files for the release. The app inside is
      # compiled once, natively (see the Dockerfile), so arm64 runs nothing
      # under emulation.
      - name: Save the image for amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: spatial-ar:${{ steps.names.outputs.version }}
          outputs: type=docker,dest=image/spatial-ar-image-${{ steps.names.outputs.version }}-amd64.tar
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            BUILD_COMMIT=${{ steps.names.outputs.commit }}
      - name: Save the image for arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: spatial-ar:${{ steps.names.outputs.version }}
          outputs: type=docker,dest=image/spatial-ar-image-${{ steps.names.outputs.version }}-arm64.tar
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            BUILD_COMMIT=${{ steps.names.outputs.commit }}
      - name: Compress
        run: gzip -9 image/*.tar && ls -la image
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image
          retention-days: 14

  publish:
    needs: [packages, image]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: release
      # The image archives joined the other files here, so the checksums
      # are taken again over all of them.
      - name: Checksums over every asset
        working-directory: release
        run: |
          sha256sum -- *.zip *.tar.gz *.tgz *.mpk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: The release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          # A pushed tag is released as it is; a manual run tags the commit
          # it checked.
          assets=(release/*.zip release/*.tar.gz release/*.tgz release/*.mpk release/SHA256SUMS.txt)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # A rerun: the release is there; make its files these.
            gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            if [ "$GITHUB_REF_TYPE" = tag ]; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
            gh release create "v$VERSION" "${where[@]}" \
              --title "Spatial Assembly AR $VERSION" \
              --notes-file release/RELEASE_NOTES.md \
              "${assets[@]}"
          fi
