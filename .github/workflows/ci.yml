name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Run the whole battery by hand from the Actions tab, and nightly against the
  # live deployment — a build that passed yesterday says nothing about the site
  # that is actually serving today.
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

jobs:
  # Fast gate: types, unit tests, production build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: jsdom 30 bundles an undici that calls
          # `webidl.util.markAsUncloneable`, which does not exist before Node
          # 21.7 — on Node 20 every test file fails to even start its worker.
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # The checks that drive a real browser: AR anchoring and the HUD, the step
  # guidance, placing and snapping, and the deployed-app behaviours a static
  # host has to satisfy. These are where the regressions in this app actually
  # show up, so CI runs them rather than trusting that someone ran them locally.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          node server/serve.mjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
      - run: npm run ar:verify
        env:
          PREVIEW_URL: http://localhost:8080/
      - run: npm run steps:check
        env:
          PREVIEW_URL: http://localhost:8080/
      - run: npm run place:check
        env:
          PREVIEW_URL: http://localhost:8080/
      - run: npm run deploy:check

  # Nightly (and on demand): the same browser checks, pointed at the deployed
  # site instead of a local build. This is what catches a bad deploy, a stale
  # service worker, a missing header — none of which a local `dist` can show.
  # It never runs on a push, so a wobbly deployment cannot block a merge.
  production-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the live site
        env:
          # Override with a repository variable if the deployment moves.
          PREVIEW_URL: ${{ vars.PREVIEW_URL || 'https://3d-ar-viewer-ten.vercel.app/' }}
        run: |
          npm run ar:verify
          npm run steps:check
          npm run place:check
