name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Run the whole battery by hand from the Actions tab, and nightly against the
  # live deployment — a build that passed yesterday says nothing about the site
  # that is actually serving today.
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  # The release workflow runs this whole battery first: nothing is released
  # that would not merge.
  workflow_call:

jobs:
  # Fast gate: types, unit tests, production build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: jsdom 30 bundles an undici that calls
          # `webidl.util.markAsUncloneable`, which does not exist before Node
          # 21.7 — on Node 20 every test file fails to even start its worker.
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # The checks that drive a real browser: AR anchoring and the HUD, the step
  # guidance, placing and snapping, and the deployed-app behaviours a static
  # host has to satisfy. These are where the regressions in this app actually
  # show up, so CI runs them rather than trusting that someone ran them locally.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          node server/serve.mjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
      # One step for all nine suites, not one each: a failing step stops the
      # job, so a red ar-verify used to keep the others from running at
      # all. Every suite runs; failures become annotations (readable through
      # the checks API, unlike the job log) and a table in the job summary;
      # and a check that stops being reported fails against the baseline.
      - name: Browser checks
        env:
          PREVIEW_URL: http://localhost:8080/
        run: node scripts/check-all.mjs
      - name: Keep the check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check-results
          retention-days: 7

  # Every release asset, built and tried the way its user would: the web
  # archives unpacked, the npm package installed and started, the Mendix widget
  # loaded into a host page by an AMD loader and as an ES module. On every push,
  # so packaging cannot rot between releases and surprise the release itself.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:package
      - run: npm run release:check

  # Nightly (and on demand): the same browser checks, pointed at the deployed
  # site instead of a local build. This is what catches a bad deploy, a stale
  # service worker, a missing header — none of which a local `dist` can show.
  # It never runs on a push, so a wobbly deployment cannot block a merge.
  production-smoke:
    # Only when CI itself runs, nightly or by hand. Called from Release, a
    # called workflow sees the caller's event (workflow_dispatch) and ran this
    # too, gating a release on the state of the live site rather than on the
    # commit being released.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.workflow == 'CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the live site
        env:
          # Override with a repository variable if the deployment moves.
          PREVIEW_URL: ${{ vars.PREVIEW_URL || 'https://3d-ar-viewer-ten.vercel.app/' }}
        # deploy-check builds its own static host; the live site is the host here.
        run: node scripts/check-all.mjs --only=ar-verify,steps-check,layout-check,place-check,notes-check,log-check,runtime-check,native-check --no-baseline
