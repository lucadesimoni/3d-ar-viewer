name: Native apps

# The Android (ARCore) and iOS (ARKit) shells around the web app. On every push
# that touches them, on any branch, so a change is built before it merges; and
# called by the release, which attaches the Android APK.
on:
  push:
    paths:
      - 'native/**'
      - 'src/native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'src/native/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The protocol's unit tests (the bridge's messages and maths), Android
      # lint, and the APK, signed with the public test key (see app/build.gradle.kts).
      - run: ./gradlew --no-daemon :protocol:test :app:lintRelease :app:assembleRelease
      - name: Name the APK
        run: |
          version=$(node -p "require('../../package.json').version")
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/spatial-ar-android-${version}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: native/android/out/*.apk
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            native/android/app/build/reports
            native/android/protocol/build/reports
          retention-days: 7
