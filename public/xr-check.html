<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebXR control test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #0b0f14; color: #e6edf3; }
  main { padding: 20px 18px 40px; max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  p.sub { color: #93a4b8; margin: 0 0 20px; }
  button { display: block; width: 100%; padding: 16px; margin: 10px 0; font-size: 1rem;
           border-radius: 12px; border: 1px solid #2b3b50; background: #16202c; color: #e6edf3; }
  button:disabled { opacity: .45; }
  #verdict { margin-top: 18px; padding: 14px; border-radius: 10px; font-weight: 600;
             border: 1px solid #2b3b50; background: #0f1720; }
  #log { margin-top: 10px; padding: 12px; border-radius: 10px; background: #0f1720;
         border: 1px solid #1f2b3a; white-space: pre-wrap; word-break: break-word;
         font: 12px/1.5 ui-monospace, monospace; min-height: 6rem; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
  .facts { color: #93a4b8; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>WebXR control test</h1>
  <p class="sub">Two ways into AR that share no code with the app. What each one shows says
     where the fault is.</p>

  <button id="raw">1 · Raw WebXR — no Babylon, no app</button>
  <button id="bjs">2 · Babylon's own AR path, default settings</button>

  <div id="verdict">press one</div>
  <div id="log">…</div>
  <p class="facts" id="facts"></p>
</main>
<canvas id="c"></canvas>

<script>
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
const verdict = (ok, m) => {
  const el = document.getElementById('verdict');
  el.textContent = (ok ? '\u2713 ' : '\u2715 ') + m;
  el.style.borderColor = ok ? '#2f6f4a' : '#7a3340';
  el.style.background = ok ? '#10261b' : '#25121a';
  log((ok ? '\u2713 ' : '\u2715 ') + m);
};
document.getElementById('log').textContent = 'ready';
// What each refusal actually means, because the browser's own wording does not
// say what to do about it and the names are easy to misread as "no AR here".
const MEANING = {
  NotAllowedError: 'AR was refused for this site. Chrome remembers a refusal: '
    + 'tap the lock icon next to the address, reset the permissions, reload, and press again.',
  SecurityError: 'The request did not count as coming from your tap. That is a bug in '
    + 'the page, not in the phone — tell me and I will fix it.',
  NotSupportedError: 'This browser will not give an AR session at all. On Android that is '
    + 'usually "Google Play Services for AR" missing or out of date — the Play Store shows it '
    + 'as ARCore. On iOS no browser has WebXR.',
  InvalidStateError: 'A session is already running in another tab. Close it and press again.',
  AbortError: 'The request was cancelled before it started.',
};
const err = (stage, e) => {
  const name = e && e.name ? e.name : '';
  verdict(false, `${stage}: ${name} ${e && e.message ? e.message : e}`);
  if (MEANING[name]) log('→ ' + MEANING[name]);
};

// Loading Babylon *after* the tap is what broke this page on a phone: a
// script fetch on a mobile link takes longer than the five seconds Chrome
// keeps transient activation, so `requestSession` was refused for lack of a
// gesture that had in fact happened. The desktop link was fast enough to hide
// it. Same trap the app avoids by preparing ahead of the tap; the control has
// to avoid it too or it is not a control.
const babylon = new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/babylonjs@9.24.0/babylon.js';
  s.onload = res; s.onerror = () => rej(new Error('CDN blocked'));
  document.head.appendChild(s);
});

(async () => {
  const f = [];
  f.push('secure=' + window.isSecureContext);
  f.push('navigator.xr=' + ('xr' in navigator));
  if (navigator.xr) {
    try { f.push('immersive-ar=' + await navigator.xr.isSessionSupported('immersive-ar')); }
    catch (e) { f.push('immersive-ar threw ' + e.name); }
  }
  f.push(navigator.userAgent.slice(0, 60));
  document.getElementById('facts').textContent = f.join(' · ');
  document.getElementById('bjs').textContent = '2 · Babylon — loading…';
  await babylon.then(
    () => { document.getElementById('bjs').textContent = "2 · Babylon's own AR path (ready)"; },
    (e) => { document.getElementById('bjs').textContent = '2 · Babylon — ' + e.message; },
  );
})();

// --- 1. Raw WebXR. About forty lines, and none of them mine from the app. ---
// A red triangle over the camera image. If this shows the room and a triangle,
// the phone, the browser and the passthrough are all fine and the fault is in
// what the app does with them. If it shows black, nothing above the browser can
// fix it.
document.getElementById('raw').onclick = async () => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { xrCompatible: true, alpha: true });
  if (!gl) return err('getContext', new Error('no WebGL'));
  const prog = gl.createProgram();
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) log('shader: ' + gl.getShaderInfoLog(s));
    return s;
  };
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, 'void main(){gl_FragColor=vec4(1.,.25,.2,1.);}'));
  gl.linkProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.3, -0.3, 0.3, -0.3, 0, 0.35]), gl.STATIC_DRAW);

  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local-floor'] });
  } catch (e) {
    err('requestSession(local-floor)', e);
    try { session = await navigator.xr.requestSession('immersive-ar'); log('· entered with no required features'); }
    catch (e2) { return err('requestSession(bare)', e2); }
  }
  verdict(true, 'raw session granted — look for a red triangle');
  try {
    await gl.makeXRCompatible();
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl, { alpha: true }) });
    const space = await session.requestReferenceSpace('local-floor')
      .catch(() => session.requestReferenceSpace('local'));
    log('✓ reference space');
    let frames = 0;
    const onFrame = (t, frame) => {
      session.requestAnimationFrame(onFrame);
      const layer = session.renderState.baseLayer;
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      // Transparent clear: the camera image is behind this layer, and an
      // opaque clear is exactly what hides it.
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const pose = frame.getViewerPose(space);
      if (pose) for (const view of pose.views) {
        const vp = layer.getViewport(view);
        gl.viewport(vp.x, vp.y, vp.width, vp.height);
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        const loc = gl.getAttribLocation(prog, 'p');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      if (++frames === 60) log('✓ 60 frames submitted' + (pose ? ' · pose tracked' : ' · NO POSE'));
    };
    session.requestAnimationFrame(onFrame);
    session.addEventListener('end', () => log(`· session ended after ${frames} frames`));
  } catch (e) { err('setting up the session', e); }
};

// --- 2. Babylon, exactly as its own documentation starts. ------------------
// Same version the app uses, default experience, one box a third of a metre
// across at eye height. No HUD, no DOM overlay, no hit-test, no app code.
document.getElementById('bjs').onclick = async (ev) => {
  if (!window.BABYLON) return verdict(false, 'Babylon has not finished loading yet — wait for the line above to say ready');
  ev.target.disabled = true;
  const canvas = document.getElementById('c');
  canvas.style.display = 'block';
  const engine = new BABYLON.Engine(canvas, true);
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);
  new BABYLON.HemisphericLight('l', new BABYLON.Vector3(0, 1, 0), scene);
  const box = BABYLON.MeshBuilder.CreateBox('b', { size: 0.3 }, scene);
  box.position = new BABYLON.Vector3(0, 1, 1.5);
  new BABYLON.FreeCamera('c', new BABYLON.Vector3(0, 1.6, 0), scene);
  engine.runRenderLoop(() => scene.render());
  try {
    const xr = await BABYLON.WebXRExperienceHelper.CreateAsync(scene);
    log('✓ helper built — entering');
    await xr.enterXRAsync('immersive-ar', 'local-floor');
    verdict(true, 'Babylon entered — a white box is 1.5 m in front of you');
    xr.onStateChangedObservable.add((s) => log('state ' + s));
  } catch (e) { err('Babylon AR', e); ev.target.disabled = false; }
};
</script>
</body>
</html>
